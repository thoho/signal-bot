services:
  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    restart: unless-stopped
    environment:
      MODE: native
    ports:
      - "8080:8080"
    volumes:
      - signal-cli-data:/home/.local/share/signal-cli

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SIGNAL_API_URL: http://signal-api:8080
      POLL_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      - signal-api

volumes:
  signal-cli-data:
